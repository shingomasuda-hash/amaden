/* ============================================================
   ブラウザ保存（localStorage）
   このUIプロトタイプにはサーバーがないため、社内・先方どちらの
   入力もこのブラウザの中だけに保存されます（他の端末とは同期しません）。
   本番実装では、この保存層をサーバーAPI＋データベースに置き換えます。
   ============================================================ */
const STORAGE_KEY = "amaden_proto_state_v1";
const loadStore = () => {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
};
const saveStore = (patch) => {
  try {
    const cur = loadStore();
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...cur, ...patch }));
  } catch (e) { /* ストレージ無効時は何もしない（プロトタイプの表示は継続） */ }
};

function Btn({ children, onClick, variant = "primary", size = "md", icon: Icon, disabled }) {
  const base = "inline-flex items-center justify-center gap-2 font-medium rounded transition-colors select-none";
  const sz = size === "sm" ? "text-xs px-2.5 py-1.5" : size === "lg" ? "text-sm px-5 py-2.5" : "text-sm px-3.5 py-2";
  const styles = {
    primary: { className: "text-white", style: { backgroundColor: disabled ? "#94a3b8" : C.navy } },
    dark: { className: "text-white", style: { backgroundColor: C.navyDark } },
    outline: { className: "border", style: { color: C.navy, borderColor: C.line2, backgroundColor: "#fff" } },
    ghost: { className: "", style: { color: C.sub } },
    danger: { className: "text-white", style: { backgroundColor: disabled ? "#fca5a5" : "#dc2626" } },
    ok: { className: "text-white", style: { backgroundColor: "#059669" } },
  }[variant];
  return (
    <button onClick={disabled ? undefined : onClick} disabled={disabled}
      className={`${base} ${sz} ${styles.className} ${disabled ? "cursor-not-allowed opacity-90" : "hover:opacity-90"}`}
      style={styles.style}>
      {Icon && <Icon size={size === "sm" ? 14 : 16} />}{children}
    </button>
  );
}

/* ワークフロー・ステッパー */
const STEPS = [
  { id: "upload", name: "アップロード", icon: Upload },
  { id: "processing", name: "AI読み取り", icon: Cpu },
  { id: "review", name: "結果確認", icon: FileCheck2 },
  { id: "work", name: "作業内容", icon: ClipboardList },
  { id: "meas", name: "測定値", icon: Ruler },
  { id: "preview", name: "提出プレビュー", icon: Eye },
  { id: "done", name: "完了", icon: CheckCircle2 },
];
function Stepper({ current, go, maxReached }) {
  const idx = STEPS.findIndex(s => s.id === current);
  return (
    <div className="flex items-center gap-1 overflow-x-auto">
      {STEPS.map((s, i) => {
        const active = i === idx, reached = i <= maxReached;
        const Icon = s.icon;
        return (
          <React.Fragment key={s.id}>
            <button disabled={!reached} onClick={() => reached && go(s.id)}
              className="flex items-center gap-2 px-2.5 py-1.5 rounded text-xs font-medium whitespace-nowrap"
              style={{
                color: active ? "#fff" : reached ? C.navy : "#b0bac6",
                backgroundColor: active ? C.navy : reached ? "#eef2f7" : "transparent",
                cursor: reached ? "pointer" : "default",
              }}>
              <span className="inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px]"
                style={{ backgroundColor: active ? "rgba(255,255,255,.2)" : reached ? "#dbe3ec" : "#eef2f7", color: active ? "#fff" : reached ? C.navy : "#b0bac6" }}>
                {i + 1}
              </span>
              <Icon size={14} /><span className="hidden xl:inline">{s.name}</span>
            </button>
            {i < STEPS.length - 1 && <ChevronRight size={14} style={{ color: "#cbd5e1" }} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

/* トースト */
function Toast({ msg, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2600); return () => clearTimeout(t); }, [msg, onClose]);
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
      <div className="flex items-center gap-2 text-white text-sm px-4 py-2.5 rounded shadow-lg" style={{ backgroundColor: C.navyDark }}>
        <Info size={15} />{msg}
      </div>
    </div>
  );
}

/* ============================================================
   案件チャット（履歴＋やり取り）
   社内の管理画面・先方向けポータルの両方から使う共通部品。
   ============================================================ */
function CaseChatPanel({ thread, onSend, viewerRole, currentUserName, onToggleAi, showAiToggle }) {
  const [text, setText] = useState("");
  const messages = thread?.messages || [];
  const listRef = React.useRef(null);
  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [messages.length]);

  const send = () => {
    const v = text.trim();
    if (!v) return;
    const author = viewerRole === "customer" ? "先方（お客様）" : currentUserName || "社内担当者";
    onSend?.({ role: viewerRole, author, text: v });
    setText("");
  };

  const roleStyle = {
    internal: { align: "items-start", bg: "#fff", border: C.line, label: "社内", labelBg: C.panel2, labelFg: C.navy },
    customer: { align: "items-end", bg: "#eef7f0", border: "#d3ecd9", label: "先方", labelBg: "#e4efe6", labelFg: "#1e7d45" },
  };

  return (
    <div className="flex flex-col" style={{ height: "100%" }}>
      {showAiToggle && (
        <label className="flex items-center justify-between gap-2 px-3 py-2 rounded border mb-2 cursor-pointer" style={{ borderColor: C.line, backgroundColor: C.panel }}>
          <span className="flex items-center gap-1.5 text-xs" style={{ color: C.ink }}><Sparkles size={13} style={{ color: C.navy }} />先方がAIエージェント経由でこのチャットを操作することを許可する</span>
          <input type="checkbox" checked={!!thread?.aiEnabled} onChange={e => onToggleAi?.(e.target.checked)} />
        </label>
      )}
      <div ref={listRef} className="flex-1 overflow-auto rounded border px-3 py-3 space-y-2.5" style={{ borderColor: C.line, backgroundColor: "#f8fafc", minHeight: 260 }}>
        {messages.length === 0 && <div className="text-center text-xs py-8" style={{ color: C.sub }}>まだやり取りはありません。</div>}
        {messages.map(m => {
          if (m.role === "system") {
            return (
              <div key={m.id} className="flex items-center gap-2 my-1">
                <div className="flex-1 h-px" style={{ backgroundColor: C.line }} />
                <span className="text-[10px] whitespace-nowrap px-2" style={{ color: C.sub }}>{m.text}（{m.at}）</span>
                <div className="flex-1 h-px" style={{ backgroundColor: C.line }} />
              </div>
            );
          }
          const rs = roleStyle[m.role] || roleStyle.internal;
          return (
            <div key={m.id} className={`flex flex-col ${rs.align}`}>
              <div className="flex items-center gap-1.5 mb-0.5">
                <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: rs.labelFg, backgroundColor: rs.labelBg }}>{rs.label}</span>
                <span className="text-[11px]" style={{ color: C.sub }}>{m.author}</span>
              </div>
              <div className="rounded-lg border px-3 py-2 text-sm max-w-[80%]" style={{ borderColor: rs.border, backgroundColor: rs.bg, color: C.ink }}>{m.text}</div>
              <span className="text-[10px] mt-0.5" style={{ color: "#a3adb8" }}>{m.at}</span>
            </div>
          );
        })}
      </div>
      <div className="flex items-end gap-2 mt-2">
        <textarea value={text} onChange={e => setText(e.target.value)} rows={2}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder={viewerRole === "customer" ? "担当者へのメッセージを入力（Enterで送信）" : "先方へのメッセージを入力（Enterで送信）"}
          className="flex-1 rounded border px-3 py-2 text-sm" style={{ borderColor: C.line2, color: C.ink }} />
        <Btn variant="primary" icon={Send} onClick={send}>送信</Btn>
      </div>
    </div>
  );
}

   ============================================================ */
function Dashboard({ cases, owners, threads, onNew, onOpen, onOwnerChange, onAddOwner, onAdmin, onOpenChat, onCopyLink, canManage }) {
  const monthOptions = useMemo(() => {
    return Array.from(new Set(cases.map(c => (c.date || "").slice(0, 7)).filter(Boolean))).sort().reverse();
  }, [cases]);
  const [month, setMonth] = useState("all");
  const [newOwner, setNewOwner] = useState("");
  const addOwnerFromDashboard = () => {
    const name = newOwner.trim();
    if (!name) return;
    onAddOwner?.(name);
    setNewOwner("");
  };
  const filteredCases = month === "all" ? cases : cases.filter(c => (c.date || "").slice(0, 7) === month);
  const count = k => filteredCases.filter(c => c.status === k).length;
  const monthLabel = m => m === "all" ? "全期間" : `${m.slice(0,4)}年${Number(m.slice(5,7))}月`;

  return (
    <div className="mx-auto px-8 py-6" style={{ maxWidth: 1440 }}>
      <div className="flex items-center justify-between mb-5">
        <div>
          <h1 className="text-xl font-semibold" style={{ color: C.ink }}>案件ダッシュボード</h1>
          <p className="text-sm mt-0.5" style={{ color: C.sub }}>整備報告書【モータ】自動作成システム</p>

        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2 rounded border bg-white px-3 py-2" style={{ borderColor: C.line2 }}>
            <Filter size={14} style={{ color: C.sub }} />
            <span className="text-xs" style={{ color: C.sub }}>登録月</span>
            <select value={month} onChange={e => setMonth(e.target.value)} className="text-sm outline-none bg-white" style={{ color: C.ink }}>
              <option value="all">全期間</option>
              {monthOptions.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}

          {canManage && <Btn variant="outline" size="lg" icon={ShieldCheck} onClick={onAdmin}>管理者画面</Btn>}
          {canManage && <Btn variant="primary" size="lg" icon={Plus} onClick={onNew}>新規案件登録</Btn>}
        </div>

/* ============================================================
   3. AI処理中
   ============================================================ */
const PROC_STEPS = [
  "PDF読み込み", "ページ分類", "基本情報抽出", "本体仕様抽出",
  "作業内容抽出", "測定値抽出", "訂正箇所検出", "提出用項目への変換",
];
function Processing({ theCase, onDone }) {
  const [step, setStep] = useState(0);
  useEffect(() => {
    if (step >= PROC_STEPS.length) { const t = setTimeout(onDone, 700); return () => clearTimeout(t); }
    const t = setTimeout(() => setStep(s => s + 1), 620);
    return () => clearTimeout(t);
  }, [step, onDone]);
  const pct = Math.round((Math.min(step, PROC_STEPS.length) / PROC_STEPS.length) * 100);

  return (
    <div className="mx-auto px-8 py-10" style={{ maxWidth: 820 }}>
      <Card>
        <div className="flex items-center gap-3 mb-1">
          <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ backgroundColor: C.navy }}>
            <Cpu size={20} className="text-white" />
          </div>
          <div>
            <div className="text-base font-semibold" style={{ color: C.ink }}>AIが成績書を読み取っています</div>
            <div className="text-xs font-mono" style={{ color: C.sub }}>{theCase?.ctrl} ／ {theCase?.customer}</div>
          </div>
        </div>

        <div className="my-4">
          <div className="flex justify-between text-xs mb-1.5"><span style={{ color: C.sub }}>進捗</span><span className="font-mono" style={{ color: C.navy }}>{pct}%</span></div>
          <div className="h-2 rounded-full overflow-hidden" style={{ backgroundColor: C.panel2 }}>
            <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, backgroundColor: C.navy }} />
          </div>
        </div>

        <div className="space-y-1.5">
          {PROC_STEPS.map((s, i) => {
            const state = i < step ? "done" : i === step ? "run" : "wait";
            return (
              <div key={s} className="flex items-center gap-3 px-3 py-2.5 rounded" style={{ backgroundColor: state === "run" ? "#f0f5fa" : "transparent" }}>
                <div className="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
                  style={{ backgroundColor: state === "done" ? "#d1fae5" : state === "run" ? C.navy : C.panel2 }}>
                  {state === "done" ? <Check size={14} style={{ color: "#059669" }} />
                    : state === "run" ? <span className="w-2.5 h-2.5 rounded-full bg-white animate-pulse" />
                    : <span className="text-[11px] font-mono" style={{ color: "#94a3b8" }}>{i + 1}</span>}
                </div>
                <span className="text-sm" style={{ color: state === "wait" ? "#94a3b8" : C.ink, fontWeight: state === "run" ? 600 : 400 }}>{s}</span>
                {state === "run" && <span className="text-xs ml-auto" style={{ color: C.navy }}>処理中…</span>}
                {state === "done" && <span className="text-xs ml-auto" style={{ color: "#059669" }}>完了</span>}
              </div>
            );
          })}
        </div>
        <div className="mt-4"><ProtoNote /></div>
      </Card>

}

/* ============================================================
   4. 読み取り結果確認（左右2カラム）
   ============================================================ */
const REVIEW_FILTERS = ["要確認項目のみ", "全項目", "基本情報", "本体仕様", "作業内容", "測定値", "不具合・処置", "固定子コイル巻替"];
function Review({ fields, setFields, onNext, toast, onAudit }) {
  const [filter, setFilter] = useState("全項目");
  const [selId, setSelId] = useState("f10");
  const [zoom, setZoom] = useState(1);
  const [page, setPage] = useState(1);

  const shown = useMemo(() => fields.filter(f => {
    if (filter === "全項目") return true;
    if (filter === "要確認項目のみ") return f.status === "review";
    if (filter === "不具合・処置") return f.defect;
    return f.grp === filter;
  }), [fields, filter]);

  const sel = fields.find(f => f.id === selId);
  const reviewLeft = fields.filter(f => f.status === "review").length;

  const setField = (id, patch) => setFields(fs => fs.map(f => f.id === id ? { ...f, ...patch } : f));

  return (
    <div className="mx-auto px-6 py-4" style={{ maxWidth: 1440 }}>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-3">
          <h1 className="text-lg font-semibold" style={{ color: C.ink }}>読み取り結果の確認</h1>
          <span className="text-xs px-2 py-1 rounded" style={{ color: STATUS.review.fg, backgroundColor: STATUS.review.bg }}>
            要確認 {reviewLeft} 件
          </span>
        </div>
        <Btn variant="primary" icon={ArrowRight} onClick={onNext}>作業内容の確認へ</Btn>
      </div>

      <div className="grid gap-4" style={{ gridTemplateColumns: "minmax(0,5fr) minmax(0,7fr)" }}>
        {/* 左：PDF表示 */}
        <Card pad={false} className="overflow-hidden">
          <div className="flex items-center justify-between px-3 py-2 border-b" style={{ borderColor: C.line, backgroundColor: C.panel }}>
            <div className="flex items-center gap-1">
              <button onClick={() => setPage(p => Math.max(1, p - 1))} className="p-1.5 rounded hover:bg-white"><ChevronLeft size={16} style={{ color: C.sub }} /></button>
              <span className="text-xs font-mono px-1.5" style={{ color: C.ink }}>{page} / 8</span>
              <button onClick={() => setPage(p => Math.min(8, p + 1))} className="p-1.5 rounded hover:bg-white"><ChevronRight size={16} style={{ color: C.sub }} /></button>
            </div>
            <div className="flex items-center gap-1">
              <button onClick={() => setZoom(z => Math.max(0.7, +(z - 0.15).toFixed(2)))} className="p-1.5 rounded hover:bg-white"><ZoomOut size={16} style={{ color: C.sub }} /></button>
              <span className="text-xs font-mono w-10 text-center" style={{ color: C.ink }}>{Math.round(zoom * 100)}%</span>
              <button onClick={() => setZoom(z => Math.min(2, +(z + 0.15).toFixed(2)))} className="p-1.5 rounded hover:bg-white"><ZoomIn size={16} style={{ color: C.sub }} /></button>
            </div>
          </div>
          <div className="overflow-auto p-4" style={{ height: 560, backgroundColor: "#e9edf1" }}>
            <MockForm zoom={zoom} page={page} highlight={sel?.box} />
          </div>
          {/* 選択項目の拡大 */}
          <div className="border-t px-3 py-2.5" style={{ borderColor: C.line, backgroundColor: C.panel }}>
            <div className="text-[11px] mb-1.5" style={{ color: C.sub }}>選択項目の認識範囲（拡大）</div>
            <div className="flex items-center gap-3">
              <div className="rounded border px-4 py-3 bg-white flex items-center justify-center" style={{ borderColor: sel ? CONF[sel.conf].ring : C.line, minWidth: 150 }}>
                <span className="text-2xl" style={{ color: "#1e40af", fontStyle: "italic", fontWeight: 700 }}>{sel?.raw || "—"}</span>
              </div>
              <div className="text-xs space-y-0.5">
                <div style={{ color: C.ink }}>{sel?.label}</div>
                <div style={{ color: C.sub }}>OCR原文をそのまま拡大表示</div>
                {sel && <ConfPill level={sel.conf} small />}
              </div>
            </div>
          </div>
        </Card>

        {/* 右：項目リスト */}
        <div>
          {/* フィルタ */}
          <div className="flex items-center gap-1.5 flex-wrap mb-3">
            <Filter size={14} style={{ color: C.sub }} className="mr-0.5" />
            {REVIEW_FILTERS.map(f => (
              <button key={f} onClick={() => setFilter(f)}
                className="text-xs px-2.5 py-1 rounded border transition-colors"
                style={f === filter
                  ? { backgroundColor: C.navy, color: "#fff", borderColor: C.navy }
                  : { backgroundColor: "#fff", color: C.sub, borderColor: C.line2 }}>
                {f}{f === "要確認項目のみ" && reviewLeft > 0 ? ` (${reviewLeft})` : ""}
              </button>
            ))}
          </div>

          <div className="space-y-2 overflow-auto pr-1" style={{ maxHeight: 620 }}>
            {shown.map(f => {
              const isSel = f.id === selId;
              const isReview = f.status === "review";
              return (
                <div key={f.id} onClick={() => setSelId(f.id)}
                  className="rounded-lg border transition-colors cursor-pointer"
                  style={{ borderColor: isSel ? C.navy : isReview ? "#f5d9a8" : C.line, backgroundColor: isReview ? "#fffdf7" : "#fff" }}>
                  <div className="px-3.5 py-2.5">
                    <div className="flex items-start justify-between gap-2">
                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: C.navy, backgroundColor: C.panel2 }}>{f.grp}</span>
                          <span className="text-sm font-medium truncate" style={{ color: C.ink }}>{f.label}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        <ConfPill level={f.conf} small />
                        {f.status === "confirmed"
                          ? <span className="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded" style={{ color: "#047857", backgroundColor: "#d1fae5" }}><Check size={11} />確定</span>
                          : <span className="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded" style={{ color: STATUS.review.fg, backgroundColor: STATUS.review.bg }}><AlertTriangle size={11} />要確認</span>}
                      </div>
                    </div>

                    {/* 詳細（選択時のみ展開） */}
                    {isSel && (
                      <div className="mt-2.5 pt-2.5 border-t grid grid-cols-2 gap-x-4 gap-y-2 text-xs" style={{ borderColor: C.line }} onClick={e => e.stopPropagation()}>
                        <div><div style={{ color: C.sub }}>OCR原文</div><div className="font-medium" style={{ color: "#1e40af" }}>{f.raw}</div></div>
                        <div><div style={{ color: C.sub }}>正規化後の値 / 単位</div><div className="font-medium" style={{ color: C.ink }}>{f.norm || "—"} <span style={{ color: C.sub }}>{f.unit}</span></div></div>
                        <div><div style={{ color: C.sub }}>転記先シート</div><div style={{ color: C.ink }}>{f.sheet}</div></div>
                        <div><div style={{ color: C.sub }}>転記先項目</div><div className="font-mono text-[11px]" style={{ color: C.ink }}>{f.target}</div></div>
                        {f.note && <div className="col-span-2 text-[11px] flex items-start gap-1" style={{ color: C.sub }}><Info size={11} className="mt-0.5" />{f.note}</div>}
                        {f.reason && <div className="col-span-2 text-[11px] flex items-start gap-1 rounded px-2 py-1" style={{ color: STATUS.review.fg, backgroundColor: STATUS.review.bg }}><AlertTriangle size={11} className="mt-0.5" />{f.reason}</div>}

                        {/* 候補選択 */}
                        {f.candidates && (
                          <div className="col-span-2">
                            <div className="mb-1" style={{ color: C.sub }}>候補から選択</div>
                            <div className="flex gap-2">
                              {f.candidates.map(cd => (
                                <button key={cd} onClick={() => { const before = f.norm; setField(f.id, { norm: cd, raw: cd }); if (before !== cd) onAudit?.("候補選択", f.label, before, cd); }}
                                  className="px-2.5 py-1 rounded border text-sm font-mono"
                                  style={f.norm === cd ? { borderColor: C.navy, color: C.navy, backgroundColor: "#eef2f7" } : { borderColor: C.line2, color: C.ink }}>
                                  {cd}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* 修正入力 */}
                        <div className="col-span-2">
                          <div className="mb-1" style={{ color: C.sub }}>修正入力</div>
                          <input value={f.norm} onChange={e => setField(f.id, { norm: e.target.value })}
                            onBlur={e => { if (e.target.value !== f.raw) onAudit?.("項目を手修正", f.label, f.raw, e.target.value); }}
                            className="w-full text-sm rounded border px-2.5 py-1.5" style={{ borderColor: C.line2, color: C.ink }} />
                        </div>

                        {/* アクション */}
                        <div className="col-span-2 flex items-center gap-2 pt-0.5">
                          <Btn size="sm" variant="ok" icon={Check} onClick={() => { setField(f.id, { status: "confirmed" }); onAudit?.("項目確定", f.label, "要確認", f.norm); toast("項目を確定しました"); }}>確定</Btn>
                          <Btn size="sm" variant="outline" icon={AlertTriangle} onClick={() => { setField(f.id, { status: "review" }); onAudit?.("要確認に差し戻し", f.label, "確定", "要確認"); }}>要確認に戻す</Btn>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {shown.length === 0 && <div className="text-center text-sm py-8" style={{ color: C.sub }}>該当する項目はありません</div>}
          </div>
        </div>
      </div>
      <div className="mt-4"><ProtoNote /></div>
    </div>
  );
}

/* ============================================================
   5. 作業内容・定型文選択
   ============================================================ */
function WorkContent({ fields, phraseSel, setPhraseSel, onNext, toast, onAudit }) {
  const defects = fields.filter(f => f.defect);
  const set = (id, patch) => setPhraseSel(s => ({ ...s, [id]: { ...s[id], ...patch } }));

  return (
    <div className="mx-auto px-8 py-5" style={{ maxWidth: 1120 }}>
      <div className="flex items-center justify-between mb-2">
        <h1 className="text-lg font-semibold" style={{ color: C.ink }}>作業内容・定型文の選択</h1>
        <Btn variant="primary" icon={ArrowRight} onClick={onNext}>測定値の確認へ</Btn>
      </div>
      <div className="flex items-start gap-1.5 text-xs mb-4 rounded px-3 py-2" style={{ color: "#475569", backgroundColor: C.panel }}>
        <Info size={13} className="mt-0.5" />
        AIは技術的な文章を新規に作成しません。手書き原文に対し、<b className="mx-1">リスト報告書に登録済みの定型文</b>から候補を提示します。適切な候補を選ぶか、原文をそのまま使用してください。
      </div>

      <div className="space-y-4">
        {defects.map(f => {
          const p = PHRASES[f.id];
          const cur = phraseSel[f.id] || { mode: "dict", symptom: p.symptomPick, treat: p.treatPick, custom: "" };
          return (
            <Card key={f.id}>
              <div className="grid gap-5" style={{ gridTemplateColumns: "minmax(0,4fr) minmax(0,6fr)" }}>
                {/* 左：手書き原文 + チェック */}
                <div>
                  <div className="text-xs mb-1" style={{ color: C.sub }}>手書き原文</div>
                  <div className="rounded border px-3 py-2.5 text-[15px] mb-3" style={{ borderColor: C.line2, color: "#1e40af", fontStyle: "italic", backgroundColor: "#fafbfc" }}>{f.raw}</div>
                  <div className="text-xs mb-1" style={{ color: C.sub }}>作業内容のチェック結果</div>
                  <div className="text-sm mb-3" style={{ color: C.ink }}>{p.check}</div>
                  <div className="flex items-center gap-3">
                    <div className="text-xs" style={{ color: C.sub }}>提出用Excelへ入れる記号</div>
                    <span className="text-2xl leading-none" style={{ color: C.navy }}>{p.symbol}</span>
                  </div>
                </div>

                {/* 右：定型文候補 */}
                <div className="border-l pl-5" style={{ borderColor: C.line }}>
                  <div className="flex items-center gap-4 mb-3">
                    <label className="flex items-center gap-1.5 text-sm cursor-pointer" style={{ color: C.ink }}>
                      <input type="radio" checked={cur.mode === "dict"} onChange={() => set(f.id, { mode: "dict" })} />
                      リスト報告書の定型文を使用
                    </label>
                    <label className="flex items-center gap-1.5 text-sm cursor-pointer" style={{ color: C.ink }}>
                      <input type="radio" checked={cur.mode === "raw"} onChange={() => set(f.id, { mode: "raw" })} />
                      原文を使用
                    </label>
                  </div>

                  {cur.mode === "dict" ? (
                    <div className="space-y-3">
                      <div>
                        <div className="text-xs mb-1" style={{ color: C.sub }}>症状・箇所（候補）</div>
                        <div className="flex flex-wrap gap-1.5">
                          {p.symptomCands.map(s => (
                            <button key={s} onClick={() => set(f.id, { symptom: s })}
                              className="text-xs px-2.5 py-1.5 rounded border text-left"
                              style={cur.symptom === s ? { borderColor: C.navy, backgroundColor: "#eef2f7", color: C.navy } : { borderColor: C.line2, color: C.ink }}>
                              {s}
                            </button>
                          ))}
                        </div>
                      </div>
                      <div>
                        <div className="text-xs mb-1" style={{ color: C.sub }}>処置内容（候補）</div>
                        <div className="flex flex-wrap gap-1.5">
                          {p.treatCands.map(s => (
                            <button key={s} onClick={() => set(f.id, { treat: s })}
                              className="text-xs px-2.5 py-1.5 rounded border text-left"
                              style={cur.treat === s ? { borderColor: C.navy, backgroundColor: "#eef2f7", color: C.navy } : { borderColor: C.line2, color: C.ink }}>
                              {s}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="text-sm rounded border px-3 py-2" style={{ borderColor: C.line2, color: C.ink, backgroundColor: "#fafbfc" }}>{f.raw}</div>
                  )}

                  <div className="mt-3">
                    <div className="text-xs mb-1" style={{ color: C.sub }}>担当者による修正（任意）</div>
                    <input value={cur.custom} placeholder="必要に応じて手直しできます"
                      onChange={e => set(f.id, { custom: e.target.value })}
                      className="w-full text-sm rounded border px-2.5 py-1.5" style={{ borderColor: C.line2, color: C.ink }} />
                  </div>

                  <div className="mt-3 flex items-center justify-between">
                    <div className="text-xs rounded px-2 py-1" style={{ color: C.navy, backgroundColor: C.panel2 }}>
                      特記事項へ転記：<b>{cur.custom || (cur.mode === "raw" ? f.raw : `${cur.symptom} → ${cur.treat}`)}</b>
                    </div>
                    <Btn size="sm" variant="ok" icon={Check} onClick={() => { onAudit?.("特記事項確定", f.label, f.raw, cur.custom || (cur.mode === "raw" ? f.raw : `${cur.symptom} → ${cur.treat}`)); toast("特記事項を確定しました"); }}>この内容で確定</Btn>
                  </div>
                </div>
              </div>
            </Card>
          );
        })}
      </div>
      <div className="mt-4"><ProtoNote /></div>
    </div>
  );
}

              <span className="text-sm font-semibold" style={{ color: C.ink }}>{tbl.title}</span>
            </div>
            <table className="w-full text-xs">
              <thead>
                <tr style={{ color: C.sub }}>
                  <th className="text-left px-3 py-1.5 font-medium">項目</th>
                  {tbl.cols.map(c => <th key={c} className="text-right px-3 py-1.5 font-medium">{MEAS_COL_LABEL[c]}</th>)}
                </tr>
              </thead>
              <tbody>
                {tbl.rows.map((r, i) => (
                  <tr key={i} className="border-t" style={{ borderColor: C.line, ...flagStyle(r.flag) }}>
                    <td className="px-3 py-1.5" style={{ color: C.ink }}>{r.name}</td>
                    {tbl.cols.map(c => {
                      if (c === "conf") return <td key={c} className="px-3 py-1.5 text-right"><ConfPill level={r.conf} small /></td>;
                      if (c === "judge") return <td key={c} className="px-3 py-1.5 text-right font-medium" style={{ color: (r.judge || "").includes("否") ? "#b45309" : r.judge === "良" ? "#047857" : C.ink }}>{r.judge || "—"}</td>;
                      if (c === "treat") return <td key={c} className="px-3 py-1.5 text-right" style={{ color: C.navy }}>{r.treat || "—"}</td>;
                      const v = r[c];
                      return <td key={c} className="px-3 py-1.5 text-right font-mono" style={{ color: v == null ? "#cbd5e1" : C.ink }}>{v == null ? "—" : v}</td>;
                    })}
                  </tr>
                ))}
                {/* 候補選択が必要な行 */}
                {tbl.rows.filter(r => r.cands).map((r, i) => (
                  <tr key={"c" + i} className="border-t" style={{ borderColor: C.line, backgroundColor: "#fef2f2" }}>
                    <td colSpan={tbl.cols.length + 1} className="px-3 py-2">
                      <div className="flex items-center gap-2 flex-wrap">
                        <AlertTriangle size={12} style={{ color: "#b91c1c" }} />
                        <span style={{ color: "#b91c1c" }}>{r.name}：{r.reason}</span>
                        <span style={{ color: C.sub }}>候補</span>
                        {r.cands.map(cd => (
                          <button key={cd} onClick={() => { setMeasSel(s => ({ ...s, [tbl.key + r.name]: cd })); onAudit?.("測定値候補選択", `${tbl.title} / ${r.name}`, r.reason, cd); toast(`${r.name} を ${cd} に確定`); }}
                            className="px-2 py-0.5 rounded border font-mono"
                            style={measSel[tbl.key + r.name] === cd ? { borderColor: C.navy, backgroundColor: "#eef2f7", color: C.navy } : { borderColor: C.line2, color: C.ink }}>
                            {cd} {r.unit}
                          </button>
                        ))}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
        ))}
      </div>
      <div className="mt-4"><ProtoNote /></div>
    </div>
  );
}

/* ============================================================
   7. 提出用プレビュー
   ============================================================ */
function Preview({ sheets, setSheets, fields, setFields, activeCase, onNext, toast, onAudit }) {
  const [activeSheet, setActiveSheet] = useState("cover");
  const f = id => fields.find(x => x.id === id)?.norm || "";
  const [previewData, setPreviewData] = useState(() => ({
    customer: f("f1") || activeCase?.customer || "近畿テクノ㈱エレベータ",
    ctrl: f("f2") || activeCase?.ctrl || "1020",
    completeDate: f("f4") || "2026 年 3 月 17 日",
    owner: activeCase?.owner || "増田 慎吾",
    title: "電動機 分解整備報告書",
    output: `${f("f10") || "55"} kW`,
    voltage: `${f("f11") || "220/440"} V`,
    pole: `${f("f12") || "4"} P`,
    current: `${f("f13") || "179/90"} A`,
    rpm: `${f("f14") || "1760"} rpm`,
    hz: `${f("f15") || "60"} Hz`,
    maker: f("f16") || "フジ",
    model: f("f17") || "MRA5205A",
    serial: f("f18") || "89118752MS2",
    bearingD: f("f19") || "6315ZZ",
    bearingB: f("f20") || "6212ZZ",
    note1: "ローター軸(D)ベアリング部 摩耗　→　溶射加工にて補修",
    note2: "固定子コイル 絶縁劣化　→　コイル巻替作業の実施",
    dcOutput: "—",
    dcVoltage: "—",
    dcCurrent: "—",
    dcRpm: "—",
    rewindReason: f("f50") || "客先希望",
    wireSize: f("f51") || "1.3/1.2 φ",
    slotCount: f("f52") || "48",
    connection: f("f53") || "220Y/440Δ",
    photoOhCaption: "分解・洗浄・ベアリング交換後の状態",
    photoRwCaption: "固定子コイル巻替後の仕上がり確認",
  }));

  const toggle = id => setSheets(ss => ss.map(s => {
    if (s.id !== id || s.always) return s;
    onAudit?.("出力シート変更", s.name, s.on ? "出力対象" : "出力対象外", !s.on ? "出力対象" : "出力対象外");
    return { ...s, on: !s.on };
  }));
  const selectedSheet = sheets.find(s => s.id === activeSheet) || sheets[0];
  useEffect(() => {
    if (!sheets.some(s => s.id === activeSheet)) setActiveSheet("cover");
  }, [sheets, activeSheet]);

  const fieldMap = {
    customer: "f1", ctrl: "f2", completeDate: "f4", output: "f10", voltage: "f11", pole: "f12", current: "f13",
    rpm: "f14", hz: "f15", maker: "f16", model: "f17", serial: "f18", bearingD: "f19", bearingB: "f20",
    rewindReason: "f50", wireSize: "f51", slotCount: "f52", connection: "f53"
  };
  // 入力の度ではなく、フォーカスが外れた時点の差分だけを履歴に残す（1文字ごとに記録すると埋もれるため）
  const focusValues = React.useRef({});
  const updateData = (key, val) => {
    setPreviewData(d => ({ ...d, [key]: val }));
    if (fieldMap[key]) {
      setFields?.(fs => fs.map(x => x.id === fieldMap[key] ? { ...x, norm: val, status: "confirmed", conf: x.conf === "low" ? "mid" : x.conf } : x));
    }
  };
  const handleFocus = (key) => { focusValues.current[key] = previewData[key] || ""; };
  const handleBlur = (key) => {
    const before = focusValues.current[key];
    const after = previewData[key] || "";
    if (before !== undefined && before !== after) {
      onAudit?.("提出用プレビュー編集", `${activeCase?.ctrl || "新規案件"} / ${key}`, before, after);
    }
  };

  const editGroups = {
    cover: [
      { id: "customer", label: "顧客名" }, { id: "completeDate", label: "作業完了日" },
      { id: "ctrl", label: "管理No" }, { id: "owner", label: "担当者" }, { id: "title", label: "件名" }
    ],
    ac: [
      { id: "output", label: "出力" }, { id: "voltage", label: "電圧" }, { id: "pole", label: "極数" },
      { id: "current", label: "電流" }, { id: "rpm", label: "回転数" }, { id: "hz", label: "周波数" },
      { id: "maker", label: "製造会社" }, { id: "model", label: "形式" }, { id: "serial", label: "製造番号" },
      { id: "bearingD", label: "ベアリングD" }, { id: "bearingB", label: "ベアリングB" },
      { id: "note1", label: "特記事項①", long: true }, { id: "note2", label: "特記事項②", long: true },
    ],
    dc: [
      { id: "dcOutput", label: "出力" }, { id: "dcVoltage", label: "電圧" }, { id: "dcCurrent", label: "電流" }, { id: "dcRpm", label: "回転数" },
    ],
    rewind: [
      { id: "rewindReason", label: "巻替理由" }, { id: "wireSize", label: "線径" }, { id: "slotCount", label: "スロット数" }, { id: "connection", label: "結線" },
    ],
    ohPhoto: [ { id: "photoOhCaption", label: "写真コメント", long: true } ],
    rwPhoto: [ { id: "photoRwCaption", label: "写真コメント", long: true } ],
  };
  const rows = editGroups[activeSheet] || editGroups.cover;

  return (
    <div className="mx-auto px-8 py-5" style={{ maxWidth: 1440 }}>
      <div className="flex items-center justify-between mb-3">
        <div>
          <h1 className="text-lg font-semibold" style={{ color: C.ink }}>提出用プレビュー</h1>
          <p className="text-xs mt-0.5" style={{ color: C.sub }}>右側のプレビュー上で、表紙以外のシートも確認・値変更できます。</p>
        </div>
        <Btn variant="primary" icon={FileText} onClick={() => { onAudit?.("帳票生成", activeCase?.ctrl || "案件", "—", "Excel/PDF生成"); onNext(); }}>Excel・PDFを生成</Btn>
      </div>

      <div className="grid gap-4" style={{ gridTemplateColumns: "minmax(0,3fr) minmax(0,9fr)" }}>
        {/* 出力対象シート */}
        <Card>
          <div className="text-sm font-semibold mb-3" style={{ color: C.ink }}>出力対象シート</div>
          <div className="space-y-1.5">
            {sheets.map(s => (
              <div key={s.id} className="flex items-center gap-2.5 px-2.5 py-2 rounded border cursor-pointer"
                onClick={() => setActiveSheet(s.id)}
                style={{ borderColor: activeSheet === s.id ? C.navy : (s.on ? C.line2 : C.line), backgroundColor: activeSheet === s.id ? "#eef4fb" : (s.on ? "#fff" : "#f8fafc") }}>
                <input type="checkbox" checked={s.on} disabled={s.always} onChange={e => { e.stopPropagation(); toggle(s.id); }} />
                <span className="text-sm flex-1" style={{ color: s.on ? C.ink : C.sub }}>{s.name}</span>
                {activeSheet === s.id && <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: C.navy, backgroundColor: "#fff" }}>表示中</span>}
                {s.always && <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: C.navy, backgroundColor: C.panel2 }}>必須</span>}
                {!s.on && !s.always && <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ color: C.sub, backgroundColor: C.panel }}>出力外</span>}
              </div>
            ))}
          </div>
          <div className="mt-3 text-[11px] flex items-start gap-1.5 rounded px-2.5 py-2" style={{ color: "#475569", backgroundColor: C.panel }}>
            <Info size={12} className="mt-0.5" />
            交流案件のため「ページ①（直流）」は初期選択から外しています。リスト報告書は客先提出PDFには含めません。
          </div>
        </Card>

        {/* Excel風プレビュー + 値編集 */}
        <Card pad={false} className="overflow-hidden">
          <div className="flex items-center gap-1 px-3 py-2 border-b overflow-x-auto" style={{ borderColor: C.line, backgroundColor: C.panel }}>
            {sheets.map((s) => (
              <button key={s.id} onClick={() => setActiveSheet(s.id)} className="text-xs px-2.5 py-1 rounded-t whitespace-nowrap border"
                style={{ backgroundColor: activeSheet === s.id ? "#fff" : "transparent", color: activeSheet === s.id ? C.navy : C.sub, borderColor: activeSheet === s.id ? C.line : "transparent", opacity: s.on ? 1 : .55 }}>
                {s.name}{!s.on && !s.always ? "（出力外）" : ""}
              </button>
            ))}
          </div>

          <div className="grid" style={{ gridTemplateColumns: "minmax(0,7.5fr) minmax(320px,3.5fr)", height: 590 }}>
            <div className="p-5 overflow-auto" style={{ backgroundColor: "#eef1f4" }}>
              <ExcelPreview activeSheet={activeSheet} data={previewData} updateData={updateData} onFocusField={handleFocus} onBlurField={handleBlur} sheet={selectedSheet} />
            </div>
            <div className="border-l p-4 overflow-auto" style={{ borderColor: C.line, backgroundColor: "#fff" }}>
              <div className="flex items-center justify-between mb-2">
                <div>
                  <div className="text-sm font-semibold" style={{ color: C.ink }}>{selectedSheet?.name || "表紙"} の入力値</div>
                  <div className="text-[11px]" style={{ color: C.sub }}>ここで変更した値はプレビューへ即時反映されます。</div>
                </div>
                {!selectedSheet?.on && <span className="text-[10px] rounded px-2 py-1" style={{ color: C.sub, backgroundColor: C.panel }}>出力対象外</span>}
              </div>

              <div className="space-y-2.5">
                {rows.map(r => (
                  <label key={r.id} className="block">
                    <div className="text-[11px] mb-1" style={{ color: C.sub }}>{r.label}</div>
                    {r.long ? (
                      <textarea value={previewData[r.id] || ""} rows={3} onChange={e => updateData(r.id, e.target.value)}
                        onFocus={() => handleFocus(r.id)} onBlur={() => handleBlur(r.id)}
                        className="w-full rounded border px-2.5 py-2 text-xs" style={{ borderColor: C.line2, color: C.ink }} />
                    ) : (
                      <input value={previewData[r.id] || ""} onChange={e => updateData(r.id, e.target.value)}
                        onFocus={() => handleFocus(r.id)} onBlur={() => handleBlur(r.id)}
                        className="w-full rounded border px-2.5 py-2 text-sm" style={{ borderColor: C.line2, color: C.ink }} />
                    )}
                  </label>
                ))}
              </div>

              <div className="mt-4 rounded border p-3" style={{ borderColor: C.line, backgroundColor: C.panel }}>
                <div className="text-xs font-semibold mb-1" style={{ color: C.ink }}>編集対象の考え方</div>
                <div className="text-[11px] leading-relaxed" style={{ color: C.sub }}>
                  本番ではこの編集欄が、整備報告書Excelの対象セルへ紐づきます。表紙、交流、直流、固定子コイル巻替、写真コメントをこの画面で確認・修正してからPDF化します。
                </div>
              </div>
            </div>
          </div>
        </Card>
      </div>
      <div className="mt-4"><ProtoNote /></div>
    </div>
  );
}

/* 整備報告書シート別のExcel風プレビュー */
function ExcelPreview({ activeSheet, data, updateData, onFocusField, onBlurField, sheet }) {
  const InputCell = ({ id, className = "", align = "left" }) => (
    <input value={data[id] || ""} onChange={e => updateData(id, e.target.value)}
      onFocus={() => onFocusField?.(id)} onBlur={() => onBlurField?.(id)}
      className={`w-full bg-transparent outline-none ${className}`}
      style={{ color: "#1f2937", textAlign: align }} />
  );
  const Row = ({ label, id, mono }) => (
    <div className="flex border-b" style={{ borderColor: "#d9dee4" }}>
      <div className="w-40 px-2 py-1.5 text-[11px] border-r" style={{ borderColor: "#d9dee4", backgroundColor: "#f6f8fa", color: "#64748b" }}>{label}</div>
      <div className={`flex-1 px-2 py-1.5 text-[13px] ${mono ? "font-mono" : ""}`}><InputCell id={id} /></div>
    </div>
  );

  const SheetFrame = ({ title, subtitle, children }) => (
    <div>
      {sheet && !sheet.on && (
        <div className="mx-auto mb-3 rounded border px-3 py-2 text-xs" style={{ width: 760, borderColor: C.line, backgroundColor: "#fff7ed", color: "#b45309" }}>
          このシートは現在「出力対象外」です。左側のチェックを入れると提出PDFに含める想定です。
        </div>
      )}
      <div className="mx-auto bg-white shadow-sm" style={{ width: 760, border: "1px solid #cfd6dd" }}>
        <div className="text-center py-3 border-b" style={{ borderColor: "#cfd6dd", backgroundColor: "#f3f5f7" }}>
          <div className="text-base font-semibold tracking-widest" style={{ color: "#1f2937" }}>{title}</div>
          {subtitle && <div className="text-[11px] mt-0.5" style={{ color: "#64748b" }}>{subtitle}</div>}
        </div>
        {children}
        <div className="text-center text-[10px] py-2" style={{ color: "#94a3b8" }}>― プレビュー（入力値は編集可能なUIモックです）―</div>
      </div>
    </div>
  );

  if (activeSheet === "cover") {
    return (
      <SheetFrame title="整 備 報 告 書" subtitle="【モータ】／ 表紙">
        <Row label="顧客名" id="customer" />
        <Row label="件名" id="title" />
        <div className="flex border-b" style={{ borderColor: "#d9dee4" }}>
          <div className="w-40 px-2 py-1.5 text-[11px] border-r" style={{ borderColor: "#d9dee4", backgroundColor: "#f6f8fa", color: "#64748b" }}>作業完了</div>
          <div className="flex-1 px-2 py-1.5 text-[13px] font-mono"><InputCell id="completeDate" /></div>
          <div className="w-32 px-2 py-1.5 text-[11px] border-l border-r" style={{ borderColor: "#d9dee4", backgroundColor: "#f6f8fa", color: "#64748b" }}>管理No</div>
          <div className="w-28 px-2 py-1.5 text-[13px] font-mono"><InputCell id="ctrl" /></div>
        </div>
        <Row label="担当者" id="owner" />
        <div className="px-6 py-20 text-center text-[12px]" style={{ color: "#94a3b8" }}>ここに提出先・表紙本文・会社情報が入る想定</div>
      </SheetFrame>
    );
  }

  if (activeSheet === "ac") {
    return (
      <SheetFrame title="ページ①（交流）" subtitle="本体仕様・作業内容・測定結果">
        <div className="px-2 py-1.5 text-[12px] font-semibold border-b" style={{ borderColor: "#cfd6dd", color: "#334155", backgroundColor: "#eef2f7" }}>本体仕様</div>
        <div className="grid grid-cols-4">
          {[
            ["出力", "output"], ["電圧", "voltage"], ["極数", "pole"], ["電流", "current"],
            ["回転数", "rpm"], ["周波数", "hz"], ["製造", "maker"], ["形式", "model"],
            ["製造番号", "serial"], ["ベアD", "bearingD"], ["ベアB", "bearingB"]
          ].map(([k, id], i) => (
            <div key={i} className="border-r border-b px-2 py-1.5" style={{ borderColor: "#d9dee4" }}>
              <div className="text-[10px]" style={{ color: "#8a94a0" }}>{k}</div>
              <div className="text-[13px] font-mono"><InputCell id={id} /></div>
            </div>
          ))}
        </div>
        <div className="px-2 py-1.5 text-[12px] font-semibold border-b" style={{ borderColor: "#cfd6dd", color: "#334155", backgroundColor: "#eef2f7" }}>特記事項</div>
        <div className="px-2 py-1.5 text-[12px] border-b" style={{ borderColor: "#d9dee4" }}><InputCell id="note1" /></div>
        <div className="px-2 py-1.5 text-[12px] border-b" style={{ borderColor: "#d9dee4" }}><InputCell id="note2" /></div>
        <div className="px-2 py-1.5 text-[12px] font-semibold border-b" style={{ borderColor: "#cfd6dd", color: "#334155", backgroundColor: "#eef2f7" }}>測定値（抜粋）</div>
        <table className="w-full text-[12px]">
          <thead><tr style={{ color: "#64748b", backgroundColor: "#f6f8fa" }}>
            {["項目", "管理値", "整備前", "整備後", "判定"].map(h => <th key={h} className="text-left px-2 py-1 font-medium border-r" style={{ borderColor: "#d9dee4" }}>{h}</th>)}
          </tr></thead>
          <tbody>
            {[["ジャーナル 負荷側", "φ75 +.011/.030", "75.009", "75.020", "良"], ["絶縁抵抗", "—", "—", "2000 MΩ", "良"], ["軸ブレ", "≦2", "1", "1", "良"]].map((r, i) => (
              <tr key={i} className="border-t" style={{ borderColor: "#d9dee4" }}>
                {r.map((c, j) => <td key={j} className={`px-2 py-1 border-r ${j > 0 && j < 4 ? "font-mono" : ""}`} style={{ borderColor: "#d9dee4", color: j === 4 ? "#047857" : "#1f2937" }}>{c}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </SheetFrame>
    );
  }

  if (activeSheet === "dc") {
    return (
      <SheetFrame title="ページ①（直流）" subtitle="直流モーター用入力プレビュー">
        <div className="grid grid-cols-4">
          {[["出力", "dcOutput"], ["電圧", "dcVoltage"], ["電流", "dcCurrent"], ["回転数", "dcRpm"]].map(([k, id], i) => (
            <div key={i} className="border-r border-b px-2 py-2" style={{ borderColor: "#d9dee4" }}>
              <div className="text-[10px]" style={{ color: "#8a94a0" }}>{k}</div>
              <div className="text-[13px] font-mono"><InputCell id={id} /></div>
            </div>
          ))}
        </div>
        <div className="px-6 py-24 text-center text-[12px]" style={{ color: "#94a3b8" }}>直流案件ではここに電機子・界磁・ブラシ等の情報が入る想定</div>
      </SheetFrame>
    );
  }

  if (activeSheet === "rewind") {
    return (
      <SheetFrame title="固定子コイル巻替" subtitle="巻替情報・巻線仕様">
        <div className="grid grid-cols-2">
          {[["巻替理由", "rewindReason"], ["線径", "wireSize"], ["スロット数", "slotCount"], ["結線", "connection"]].map(([k, id], i) => (
            <div key={i} className="border-r border-b px-3 py-2" style={{ borderColor: "#d9dee4" }}>
              <div className="text-[10px]" style={{ color: "#8a94a0" }}>{k}</div>
              <div className="text-[13px] font-mono"><InputCell id={id} /></div>
            </div>
          ))}
        </div>
        <div className="px-6 py-20 text-center text-[12px]" style={{ color: "#94a3b8" }}>巻数・絶縁種別・ワニス処理・試験結果などを追加配置する想定</div>
      </SheetFrame>
    );
  }

  return (
    <SheetFrame title={activeSheet === "ohPhoto" ? "写真【OH】" : "写真【巻替え】"} subtitle="写真台紙プレビュー">
      <div className="grid grid-cols-2 gap-3 p-4">
        {[1,2,3,4].map(n => (
          <div key={n} className="border rounded p-3" style={{ borderColor: "#d9dee4" }}>
            <div className="h-32 rounded flex items-center justify-center mb-2" style={{ backgroundColor: "#eef2f7", color: "#94a3b8" }}><Image size={28} /></div>
            <div className="text-[12px]"><InputCell id={activeSheet === "ohPhoto" ? "photoOhCaption" : "photoRwCaption"} /></div>
          </div>
        ))}
      </div>
    </SheetFrame>
  );
}

/* ============================================================
   8. 生成完了

    setName(""); setEmail(""); setRole("担当者");

  const updateAcc = (id, patch) => {
    const acc = accounts.find(a => a.id === id);
    if (acc) {
      const key = Object.keys(patch)[0];

    }
    setAccounts(as => as.map(a => a.id === id ? { ...a, ...patch } : a));

  const removeAcc = (a) => {
    if (a.id === currentUser?.id) { toast("ログイン中の自分自身は削除できません"); return; }
    if (!window.confirm(`${a.name} を削除しますか？この操作は取り消せません。`)) return;

  const logUsers = useMemo(() => ["全員", ...Array.from(new Set(logs.map(l => l.user)))], [logs]);

/* URLの #/customer/<管理番号> を読み取る（お客様ポータル用の簡易ルーティング） */
const parseCustomerHash = () => {
  const m = /^#\/customer\/(.+)$/.exec(window.location.hash || "");
  return m ? decodeURIComponent(m[1]) : null;
};

function App() {
  const [screen, setScreen] = useState("dashboard"); // dashboard / admin / casechat / workflow steps
  const [loggedIn, setLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const stored = useMemo(() => loadStore(), []);
  const [accounts, setAccounts] = useState(stored.accounts || ACCOUNTS_INIT);
  const [auditLogs, setAuditLogs] = useState(stored.auditLogs || AUDIT_LOGS_INIT);
  const [cases, setCases] = useState(stored.cases || CASES);
  const [threads, setThreads] = useState(stored.threads || CASE_THREADS_INIT);
  const [activeCase, setActiveCase] = useState(null);
  const [fields, setFields] = useState(FIELDS_INIT);
  const [phraseSel, setPhraseSel] = useState({});
  const [measSel, setMeasSel] = useState({});
  const [sheets, setSheets] = useState(SHEETS_INIT);
  const [toastMsg, setToastMsg] = useState(null);
  const [customerRoute, setCustomerRoute] = useState(parseCustomerHash);
  const toast = m => setToastMsg(m);
  const owners = accounts.filter(a => a.status === "有効").map(a => a.name);

  // ブラウザ内保存（このプロトタイプはサーバーを持たないため、同じブラウザでのみ状態が残ります）
  useEffect(() => { saveStore({ accounts }); }, [accounts]);
  useEffect(() => { saveStore({ auditLogs }); }, [auditLogs]);
  useEffect(() => { saveStore({ cases }); }, [cases]);
  useEffect(() => { saveStore({ threads }); }, [threads]);

  // お客様ポータルのURL（#/customer/<管理番号>）を監視
  useEffect(() => {
    const onHash = () => setCustomerRoute(parseCustomerHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const audit = (action, target, before = "—", after = "—") => {
    setAuditLogs(ls => [{ id: "l" + Date.now() + Math.random(), at: nowText(), user: currentUser?.name || "未ログイン", action, target, before: String(before || "—"), after: String(after || "—") }, ...ls]);
  };
  // 「誰が・どこを」触ったかを、全社共通の変更履歴と、その案件のチャット/履歴タイムラインの両方に残す
  const logActivity = (action, target, before, after, ctrl) => {
    audit(action, target, before, after);
    if (ctrl) {
      pushCaseMessage(ctrl, { role: "system", author: "システム", text: `${currentUser?.name || "担当者"} が「${action}」を行いました（${target}${after && after !== "—" ? ` → ${after}` : ""}）` });
    }
  };
  const addAccount = (name, email = "", role = "担当者") => {
    if (accounts.some(a => a.name === name)) { toast(`${name} は既に登録済みです`); return; }
    setAccounts(as => [...as, { id: "u" + Date.now(), name, email, role, status: "有効", created: nowText().slice(0,10) }]);
    audit("アカウント追加", name, "—", role);
    toast(`${name} を追加しました`);
  };
  const deleteAccount = (a) => {
    setAccounts(as => as.filter(x => x.id !== a.id));
    audit("アカウント削除", a.name, a.role, "削除済み");
    toast(`${a.name} を削除しました`);
  };

  const maxReached = STEPS.findIndex(s => s.id === screen);

  const threadFor = ctrl => threads[ctrl] || { aiEnabled: false, messages: [] };
  const pushCaseMessage = (ctrl, msg) => {
    setThreads(ts => {
      const cur = ts[ctrl] || { aiEnabled: false, messages: [] };
      return { ...ts, [ctrl]: { ...cur, messages: [...cur.messages, { id: "m" + Date.now() + Math.random(), at: nowText(), ...msg }] } };
    });
  };
  const sendCaseMessage = (theCase, msg) => {
    if (!theCase?.ctrl) return;
    pushCaseMessage(theCase.ctrl, msg);
    const preview = msg.text.length > 40 ? msg.text.slice(0, 40) + "…" : msg.text;
    setAuditLogs(ls => [{ id: "l" + Date.now() + Math.random(), at: nowText(), user: msg.author, action: "メッセージ送信", target: theCase.ctrl, before: "—", after: preview }, ...ls]);
  };
  const toggleAi = (theCase, enabled) => {
    if (!theCase?.ctrl) return;
    setThreads(ts => ({ ...ts, [theCase.ctrl]: { ...(ts[theCase.ctrl] || { messages: [] }), aiEnabled: enabled } }));
    audit("AIエージェント操作の許可変更", theCase.ctrl, enabled ? "無効" : "許可", enabled ? "許可" : "無効");
  };
  const copyCustomerLink = (theCase) => {
    if (!theCase?.ctrl) return;
    const url = `${window.location.origin}${window.location.pathname}#/customer/${encodeURIComponent(theCase.ctrl)}`;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(url).then(() => toast("先方用リンクをコピーしました")).catch(() => toast(url));
    } else { toast(url); }
  };
  const openChat = (c) => { setActiveCase(c); setScreen("casechat"); };

  const updateOwner = (caseId, owner) => {
    if (caseId) {
      const targetCase = cases.find(c => c.id === caseId);
      if (targetCase && targetCase.owner !== owner) {
        audit("担当者変更", targetCase.ctrl, targetCase.owner || "未設定", owner || "未設定");
        pushCaseMessage(targetCase.ctrl, { role: "system", author: "システム", text: `${currentUser?.name || "担当者"} が担当者を「${targetCase.owner || "未設定"}」から「${owner || "未設定"}」に変更しました。` });
      }
      setCases(cs => cs.map(c => c.id === caseId ? { ...c, owner } : c));
    }
    setActiveCase(c => c && (!caseId || c.id === caseId) ? { ...c, owner } : c);
  };

  const openCase = (c, at) => {
    setActiveCase(c);
    setFields(FIELDS_INIT.map(f => ({ ...f })));
    setScreen(at);
    if (c?.ctrl) {
      audit("案件を開いた", c.ctrl, "—", STEPS.find(s => s.id === at)?.name || at);
      pushCaseMessage(c.ctrl, { role: "system", author: "システム", text: `${currentUser?.name || "担当者"} が案件を開きました（${STEPS.find(s => s.id === at)?.name || at}）。` });
    }
  };
  const newCase = () => {
    const c = { id: "c" + Date.now(), ctrl: "26MT1020B", customer: "近畿テクノ㈱エレベータ", kind: "交流", rewind: true, pages: 8, owner: owners[0] || "", status: "review", date: nowText().slice(0,10) };
    setActiveCase(c);
    setFields(FIELDS_INIT.map(f => ({ ...f })));
    setScreen("upload");
    audit("案件登録", c.ctrl, "—", c.customer);
  };
  const goHome = () => { setScreen("dashboard"); setActiveCase(null); };

  const inFlow = !["dashboard", "admin", "casechat"].includes(screen);
  const canManage = currentUser?.role !== "閲覧者";
  const isAdmin = currentUser?.role === "管理者";

  // お客様ポータル：ログイン不要でリンクから直接開く
  if (customerRoute) {
    const theCase = cases.find(c => c.ctrl === customerRoute) || null;
    return (
      <CustomerPortal
        theCase={theCase}
        thread={theCase ? threadFor(theCase.ctrl) : null}
        onSend={(msg) => sendCaseMessage(theCase, msg)}
        onBackToStaff={loggedIn ? () => { window.location.hash = ""; setCustomerRoute(null); } : null}
      />
    );
  }

  if (!loggedIn) {
    return <LoginScreen accounts={accounts} onLogin={(u) => { setCurrentUser(u); setLoggedIn(true); setScreen("dashboard"); setAuditLogs(ls => [{ id: "l" + Date.now(), at: nowText(), user: u?.name || "未選択", action: "ログイン", target: "システム", before: "—", after: "成功" }, ...ls]); }} />;
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: "#f0f2f5", fontFamily: "'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif" }}>
      {/* ヘッダ */}
      <header className="sticky top-0 z-40" style={{ backgroundColor: C.navy }}>
        <div className="mx-auto flex items-center justify-between px-6 h-14" style={{ maxWidth: 1440 }}>
          <button onClick={goHome} className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded flex items-center justify-center" style={{ backgroundColor: "rgba(255,255,255,.12)" }}>
              <FileSpreadsheet size={17} className="text-white" />
            </div>
            <div className="text-left">
              <div className="text-white text-sm font-semibold leading-tight">整備報告書【モータ】自動作成システム</div>
              <div className="text-[10px] leading-tight" style={{ color: "#a9bdd4" }}>Amaden ／ 分解整備成績書 → 整備報告書</div>
            </div>
          </button>
          <div className="flex items-center gap-4">
            <div className="hidden lg:flex items-center gap-1.5 text-[10px] px-2.5 py-1 rounded" style={{ color: "#ffe3b0", backgroundColor: "rgba(255,255,255,.08)" }}>
              <Info size={11} /> UIプロトタイプ（OCR・Excel・PDF・保存は本番実装時に接続）
            </div>
            {currentUser?.role === "管理者" && <Btn size="sm" variant="outline" icon={ShieldCheck} onClick={() => setScreen("admin")}>管理者</Btn>}
            <div className="flex items-center gap-2 text-white text-xs">
              <div className="w-7 h-7 rounded-full flex items-center justify-center text-[11px]" style={{ backgroundColor: "rgba(255,255,255,.15)" }}>{(currentUser?.name || "担").slice(0,1)}</div>
              <span className="hidden md:inline">{currentUser?.name}（{currentUser?.role}）</span>
            </div>
            <button onClick={() => { audit("ログアウト", "システム", "—", "実行"); setLoggedIn(false); setCurrentUser(null); }} className="text-[11px] flex items-center gap-1" style={{ color: "#cbd5e1" }}><LogOut size={12} />ログアウト</button>
          </div>
        </div>
        {/* ステッパー（フロー中のみ） */}
        {inFlow && (
          <div style={{ backgroundColor: "#fff", borderBottom: `1px solid ${C.line}` }}>
            <div className="mx-auto px-6 py-2 flex items-center justify-between gap-4" style={{ maxWidth: 1440 }}>
              <Stepper current={screen} go={setScreen} maxReached={maxReached} />
              <button onClick={goHome} className="text-xs whitespace-nowrap flex items-center gap-1" style={{ color: C.sub }}>
                <LayoutDashboard size={13} />一覧へ
              </button>
            </div>
          </div>
        )}
      </header>

      {/* 本体 */}
      <main>
        {screen === "dashboard" && <Dashboard cases={cases} owners={owners} threads={threads} canManage={canManage} onNew={newCase} onOpen={openCase} onOwnerChange={updateOwner} onAddOwner={(name) => addAccount(name, "", "担当者")} onAdmin={() => setScreen("admin")} onOpenChat={openChat} onCopyLink={copyCustomerLink} />}
        {screen === "admin" && isAdmin && <AdminPanel accounts={accounts} setAccounts={setAccounts} logs={auditLogs} cases={cases} threads={threads} currentUser={currentUser} onBack={() => setScreen("dashboard")} onAddAccount={addAccount} onDeleteAccount={deleteAccount} onAudit={audit} onOpenChat={openChat} onCopyLink={copyCustomerLink} toast={toast} />}
        {screen === "casechat" && <CaseChatScreen theCase={activeCase} thread={threadFor(activeCase?.ctrl)} currentUserName={currentUser?.name} onSend={sendCaseMessage} onToggleAi={toggleAi} onCopyLink={copyCustomerLink} onBack={goHome} />}
        {screen === "upload" && <UploadScreen theCase={activeCase} owners={owners} onStart={() => setScreen("processing")} onOwnerChange={updateOwner} onAddOwner={(name) => addAccount(name, "", "担当者")} onAudit={(a, t, b, af) => logActivity(a, t, b, af, activeCase?.ctrl)} />}
        {screen === "processing" && <Processing theCase={activeCase} onDone={() => setScreen("review")} />}
        {screen === "review" && <Review fields={fields} setFields={setFields} onNext={() => setScreen("work")} toast={toast} onAudit={(a, t, b, af) => logActivity(a, t, b, af, activeCase?.ctrl)} />}
        {screen === "work" && <WorkContent fields={fields} phraseSel={phraseSel} setPhraseSel={setPhraseSel} onNext={() => setScreen("meas")} toast={toast} onAudit={(a, t, b, af) => logActivity(a, t, b, af, activeCase?.ctrl)} />}
        {screen === "meas" && <Measurements measSel={measSel} setMeasSel={setMeasSel} onNext={() => setScreen("preview")} toast={toast} onAudit={(a, t, b, af) => logActivity(a, t, b, af, activeCase?.ctrl)} />}
        {screen === "preview" && <Preview sheets={sheets} setSheets={setSheets} fields={fields} setFields={setFields} activeCase={activeCase} toast={toast} onAudit={(a, t, b, af) => logActivity(a, t, b, af, activeCase?.ctrl)} onNext={() => setScreen("done")} />}
        {screen === "done" && <Done theCase={activeCase} toast={toast} onHome={goHome} />}
      </main>

      {toastMsg && <Toast msg={toastMsg} onClose={() => setToastMsg(null)} />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
